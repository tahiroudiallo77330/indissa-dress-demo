                            - paragraph [ref=e597]: Présentation
                            - generic [ref=e598]:
                              - paragraph [ref=e599]: Dans le sud-est de Paris, à Créteil, Coiff’Ethnic est un salon de coiffure à l’esprit multi-ethnique, spécialisé notamment dans le soin des cheveux afro. Outre les prestations classiques, vous pourrez bénéficier de soins plus spécifiques comme le lissage brésilien, le défrisage, le tissage et la pose de nattes.
                              - paragraph [ref=e600]: L’équipe de Coiff’Ethnic possède le savoir-faire nécessaire pour traiter tous les types de cheveux, afro comme européens, et vous conseille sur la coupe la plus adaptée à votre visage. Envie d’arborer une belle et longue chevelure ? La pose de tissage réalisée chez Coiff’Ethnic vous permettra de gagner en longueur et densité de façon naturelle.
                              - paragraph [ref=e601]: Vous avez les cheveux bouclés, frisés ou crépus et vous rêvez d’une chevelure lisse et souple, qui dure dans le temps ? Optez pour le défrisage dont votre coiffeur maîtrise parfaitement la technique ou pour le lissage brésilien qui a l’avantage d’être une méthode plus douce et moins définitive pour obtenir des cheveux raides et brillants.
                              - paragraph [ref=e602]: Situé à Créteil, en Île-de-France, le salon de coiffure Coiff’Ethnic met à votre service son équipe d’experts en extensions de cheveux et techniques de lissage pour répondre à toutes les envies et garantir un rendu professionnel pour des cheveux en bonne santé.
